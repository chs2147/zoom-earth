name: Deploy Typhoon Lens

# The control server (web/control, on Vercel) decides when to deploy: it
# watches each model's source and starts this workflow with the model runs to
# carry, or hourly to refresh official warnings and overlays. Frames for a run
# are built once and reused from the Actions cache afterwards. A run left
# empty is looked up here (manual runs); "skip" leaves an optional model out.
on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why the deploy was started (shown in the run title)
        default: ""
      gfs_run:
        description: GFS run YYYYMMDDHH (empty = latest complete)
        default: ""
      icon_run:
        description: ICON run YYYYMMDDHH (empty = latest complete, skip = leave out)
        default: ""
  push:
    branches: [main]
    paths:
      - "web/app/**"
      - "web/pipeline/**"
      - ".github/workflows/typhoon-lens.yml"

# The control server reads the model runs back from this title.
run-name: ${{ inputs.reason && format('Typhoon Lens · {0} · gfs {1} · icon {2}', inputs.reason, inputs.gfs_run || 'auto', inputs.icon_run || 'auto') || '' }}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: typhoon-lens-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: web/pipeline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: web/pipeline/requirements.txt

      - run: pip install -r requirements.txt

      - name: Choose model runs
        id: runs
        env:
          GFS_RUN: ${{ inputs.gfs_run }}
          ICON_RUN: ${{ inputs.icon_run }}
        run: |
          [[ "$GFS_RUN" =~ ^([0-9]{10})?$ ]] || { echo "invalid GFS run: $GFS_RUN"; exit 1; }
          [[ "$ICON_RUN" =~ ^([0-9]{10}|skip)?$ ]] || { echo "invalid ICON run: $ICON_RUN"; exit 1; }
          gfs="${GFS_RUN:-$(python -m typhoon_lens.build ../app/public/data --model gfs --latest)}"
          icon="${ICON_RUN:-$(python -m typhoon_lens.build ../app/public/data --model icon --latest || true)}"
          [ "$icon" = skip ] && icon=""
          echo "gfs=$gfs" >> "$GITHUB_OUTPUT"
          echo "icon=$icon" >> "$GITHUB_OUTPUT"
          echo "GFS $gfs, ICON ${icon:-none}"

      - name: Restore GFS frames
        id: gfs
        uses: actions/cache/restore@v4
        with:
          path: web/app/public/data/gfs
          key: typhoon-lens-gfs-${{ steps.runs.outputs.gfs }}

      - name: Build GFS frames
        if: steps.gfs.outputs.cache-hit != 'true'
        run: python -m typhoon_lens.build ../app/public/data --model gfs --run "${{ steps.runs.outputs.gfs }}" --keep 1

      - name: Save GFS frames
        if: steps.gfs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: web/app/public/data/gfs
          key: typhoon-lens-gfs-${{ steps.runs.outputs.gfs }}

      - name: Restore ICON frames
        id: icon
        if: steps.runs.outputs.icon != ''
        uses: actions/cache/restore@v4
        with:
          path: web/app/public/data/icon
          key: typhoon-lens-icon-${{ steps.runs.outputs.icon }}

      # A DWD outage keeps the site up with GFS only.
      - name: Build ICON frames
        id: icon-build
        if: steps.runs.outputs.icon != '' && steps.icon.outputs.cache-hit != 'true'
        continue-on-error: true
        run: python -m typhoon_lens.build ../app/public/data --model icon --run "${{ steps.runs.outputs.icon }}" --keep 1

      - name: Save ICON frames
        if: steps.icon-build.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: web/app/public/data/icon
          key: typhoon-lens-icon-${{ steps.runs.outputs.icon }}

      - name: Write model index
        run: python -m typhoon_lens.build ../app/public/data --index-only

      # A JTWC or NHC outage keeps the site up; the app then shows no warnings.
      - name: Refresh official warnings
        continue-on-error: true
        run: python -m typhoon_lens.official ../app/public/data

      # Probe NASA GIBS for a satellite and date that return imagery; the
      # log lists every candidate tried.
      - name: Choose observation overlays
        continue-on-error: true
        run: python -m typhoon_lens.overlays ../app/public/data

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/app/package-lock.json

      - name: Build site
        working-directory: web/app
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
