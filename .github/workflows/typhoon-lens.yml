name: Deploy Typhoon Lens

# Hourly: refresh official cyclone warnings and redeploy. When a new GFS run
# (every 6 hours) or ICON 00Z/12Z run is complete, build its forecast frames
# first; otherwise reuse the frames cached for that run.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/typhoon-lens.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: typhoon-lens-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: web/pipeline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: web/pipeline/requirements.txt

      - run: pip install -r requirements.txt

      - name: Find latest complete model runs
        id: runs
        run: |
          echo "gfs=$(python -m typhoon_lens.build ../app/public/data --model gfs --latest)" >> "$GITHUB_OUTPUT"
          echo "icon=$(python -m typhoon_lens.build ../app/public/data --model icon --latest || true)" >> "$GITHUB_OUTPUT"

      - name: Restore GFS frames
        id: gfs
        uses: actions/cache/restore@v4
        with:
          path: web/app/public/data/gfs
          key: typhoon-lens-gfs-${{ steps.runs.outputs.gfs }}

      - name: Build GFS frames
        if: steps.gfs.outputs.cache-hit != 'true'
        run: python -m typhoon_lens.build ../app/public/data --model gfs --run "${{ steps.runs.outputs.gfs }}" --keep 1

      - name: Save GFS frames
        if: steps.gfs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: web/app/public/data/gfs
          key: typhoon-lens-gfs-${{ steps.runs.outputs.gfs }}

      - name: Restore ICON frames
        id: icon
        if: steps.runs.outputs.icon != ''
        uses: actions/cache/restore@v4
        with:
          path: web/app/public/data/icon
          key: typhoon-lens-icon-${{ steps.runs.outputs.icon }}

      # A DWD outage keeps the site up with GFS only.
      - name: Build ICON frames
        id: icon-build
        if: steps.runs.outputs.icon != '' && steps.icon.outputs.cache-hit != 'true'
        continue-on-error: true
        run: python -m typhoon_lens.build ../app/public/data --model icon --run "${{ steps.runs.outputs.icon }}" --keep 1

      - name: Save ICON frames
        if: steps.icon-build.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: web/app/public/data/icon
          key: typhoon-lens-icon-${{ steps.runs.outputs.icon }}

      - name: Write model index
        run: python -m typhoon_lens.build ../app/public/data --index-only

      # A JTWC or NHC outage keeps the site up; the app then shows no warnings.
      - name: Refresh official warnings
        continue-on-error: true
        run: python -m typhoon_lens.official ../app/public/data

      # Probe NASA GIBS for a satellite and date that return imagery; the
      # log lists every candidate tried.
      - name: Choose observation overlays
        continue-on-error: true
        run: python -m typhoon_lens.overlays ../app/public/data

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/app/package-lock.json

      - name: Build site
        working-directory: web/app
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
