<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Typhoon Lens 운영</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header>
      <h1>Typhoon Lens 운영</h1>
      <p class="sub">모델별 새 실행을 감지해 변환·배포를 시작하고 상태를 보여 줍니다. <a id="site" href="#" target="_blank" rel="noopener">사이트 열기</a></p>
    </header>

    <main>
      <section>
        <div class="section-head">
          <h2>모델</h2>
          <span id="checked" class="muted"></span>
        </div>
        <div id="models" class="cards"></div>
        <p id="plan" class="plan"></p>
        <ul id="errors" class="errors"></ul>
      </section>

      <section>
        <h2>최근 배포 작업</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>작업</th><th>상태</th><th>시작</th><th>소요</th></tr>
            </thead>
            <tbody id="runs"></tbody>
          </table>
        </div>
      </section>

      <section>
        <h2>관리</h2>
        <p class="muted">관리 토큰(Vercel 환경 변수 <code>ADMIN_TOKEN</code>)이 있어야 실행됩니다. 토큰은 이 브라우저에만 저장됩니다.</p>
        <label class="token">관리 토큰 <input id="token" type="password" autocomplete="off" /></label>
        <div class="actions">
          <button data-action="check">지금 점검</button>
          <button data-action="refresh">지금 재배포</button>
          <button data-action="retry" data-model="gfs">GFS 다시 시도</button>
          <button data-action="retry" data-model="icon">ICON 다시 시도</button>
        </div>
        <pre id="result" class="result" hidden></pre>
      </section>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
