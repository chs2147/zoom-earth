<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1117" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='11' fill='%230d1117'/%3E%3Ccircle cx='12' cy='12' r='6' fill='none' stroke='%235aa7ff' stroke-width='3'/%3E%3C/svg%3E" />
    <title>Typhoon Lens</title>
    <meta name="description" content="GFS 16일 예보 지도와 열대저기압 진로를 보는 개인용 날씨 지도" />
  </head>
  <body>
    <div id="map" role="application" aria-label="예보 지도"></div>

    <header class="brand">
      <h1>Typhoon Lens</h1>
      <p id="run">예보 불러오는 중…</p>
      <p id="status" role="status"></p>
    </header>

    <nav class="controls" aria-label="지도 메뉴">
      <button id="layers-button" class="round" aria-label="레이어" aria-controls="layers-panel">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 8l10 5 10-5-10-5Zm-7.6 8.2L2 12.4l10 5 10-5-2.4-1.2L12 15 4.4 11.2Zm0 4.4L2 16.8l10 5 10-5-2.4-1.2L12 19.4l-7.6-3.8Z"/></svg>
      </button>
      <button id="storms-button" class="round" aria-label="열대저기압" aria-controls="storms-panel">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6Zm8.5-5.5c-4.7-1.4-9.6.2-12.2 3.9C5 8 2.9 11 3.5 15c.2-2.4 1.4-4.4 3.2-5.8a6 6 0 0 0 10.6 5.6c-1.4 4-5.5 6.5-10 6.2 4.7 1.4 9.6-.2 12.2-3.9 3.3-.6 5.4-3.6 4.8-7.6-.2 2.4-1.4 4.4-3.2 5.8a6 6 0 0 0-10.6-5.6c1.4-4 5.5-6.5 10-6.2Z"/></svg>
      </button>
    </nav>

    <section id="layers-panel" class="panel" hidden aria-label="레이어">
      <div class="panel-head"><h2>레이어</h2><button class="panel-close" aria-label="닫기">×</button></div>
      <h3>예보 지도</h3>
      <div id="layer-list" role="radiogroup"></div>
      <h3>관측 · 오버레이</h3>
      <div id="overlay-list"></div>
    </section>

    <section id="storms-panel" class="panel" hidden aria-label="열대저기압">
      <div class="panel-head"><h2>열대저기압</h2><button class="panel-close" aria-label="닫기">×</button></div>
      <p class="panel-note">GFS 모델에서 자동으로 찾은 진로입니다. 기상청·JTWC 공식 예보가 아닙니다.</p>
      <ul id="storm-list"></ul>
    </section>

    <div id="probe" hidden></div>

    <footer class="timeline">
      <div id="legend" hidden></div>
      <div class="time-row">
        <button id="play" class="round" aria-label="재생" aria-pressed="false">
          <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
          <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zm6 0h4v14h-4z"/></svg>
        </button>
        <div class="time-text">
          <strong id="clock"></strong>
          <span id="lead"></span>
        </div>
      </div>
      <div class="slider">
        <input id="time" type="range" aria-label="예보 시각" />
        <div id="ticks" aria-hidden="true"></div>
      </div>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
